graphhopper:
  # Set via -Ddw.graphhopper.datareader.file=... or edit here before import
  datareader.file: norcal-latest.osm.pbf
  graph.location: graph-cache

  # Foot-oriented graph: motorways/trunks are useless for running and bloat the graph
  import.osm.ignored_highways: motorway,trunk

  # Elevation for GPX output and slope-aware custom models (tiles auto-download)
  graph.elevation.provider: srtm
  graph.elevation.cache_dir: ./elevation-cache

  profiles:
    - name: foot
      custom_model_files: [foot.json, foot_elevation.json]
    - name: hike
      custom_model_files: [hike.json, foot_elevation.json]

  # No CH (speed mode): algorithm=round_trip requires flexible mode, and skipping
  # CH preparation is what keeps the import within a 4 GB Pi's RAM.
  profiles_ch: []
  profiles_lm: []

  # Needed by the bundled foot/hike models plus the request-time custom models
  # (trail preference, flat routes) sent by the route-builder backend.
  graph.encoded_values: foot_access, foot_priority, foot_average_speed, hike_rating, road_class, road_environment, surface, average_slope, foot_road_access, country, mtb_rating, foot_network

  # Flexible-mode routing limits; running routes are short so this is generous.
  routing.non_ch.max_visited_nodes: 1000000

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
  request_log:
    appenders: []

logging:
  appenders:
    - type: console
      time_zone: system
