[project]
name = "routebuilder"
version = "0.1.0"
description = "Running route builder backend: GraphHopper routing, GPX export, Garmin course upload"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "garth>=0.5",
    "pydantic>=2.9",
]

[project.scripts]
routebuilder = "routebuilder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["routebuilder"]
